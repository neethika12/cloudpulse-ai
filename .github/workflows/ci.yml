name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (pytest + real Postgres/pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: cloudpulse
          POSTGRES_DB: cloudpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://cloudpulse:cloudpulse@localhost:5432/cloudpulse
      ENVIRONMENT: test
      # Tests replace OpenAI with a fake client; no key is needed or used.
      OPENAI_API_KEY: ""
      SLACK_WEBHOOK_URL: ""
      JWT_SECRET_KEY: ci-test-secret-not-for-prod
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      APP_ENCRYPTION_KEY: HicjRZLuUYNG8mY1YeYDN5WbfeESSC5ovmp793lVLrU=

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Alembic migrations against real Postgres
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest -v

  rag-evals:
    name: RAG + agent evals (needs OPENAI_API_KEY secret)
    runs-on: ubuntu-latest
    needs: [backend-tests]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: cloudpulse
          POSTGRES_DB: cloudpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://cloudpulse:cloudpulse@localhost:5432/cloudpulse
      ENVIRONMENT: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      # Evals call real models, so they cost a few cents per run. Forks and repos
      # without the secret skip them instead of failing.
      - name: Check for API key
        id: key
        run: echo "present=${{ env.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install, migrate, run evals with thresholds
        if: steps.key.outputs.present == 'true'
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m evals.run --check

      - name: Upload eval report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/evals/results/

  frontend-build:
    name: Frontend type-check + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # package-lock.json is generated on whatever machine last ran `npm install`
        # locally (a Mac, in this project's case). Rollup ships OS/arch-specific
        # optional binaries, and npm has a long-standing bug (npm/cli#4828) where a
        # lockfile resolved on one platform can omit the binary another platform
        # needs, so `npm install`/`npm ci` fails on CI with "Cannot find module
        # @rollup/rollup-linux-x64-gnu". Deleting the lockfile here forces npm to
        # resolve dependencies fresh against the runner's actual platform every
        # time, which sidesteps the bug entirely. The committed lockfile is still
        # used for local dev and Docker builds, where this hasn't been an issue.
        run: |
          rm -f package-lock.json
          npm install

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: cloudpulse-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: cloudpulse-frontend:ci
